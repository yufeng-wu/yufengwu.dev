<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Calmera, a meal journal for iPhone, and an academic website.">
<meta name="color-scheme" content="light dark">
<title>Home</title>
<style>
:root{color-scheme:light dark;--bg:#FFFBF9;--bg-end:#FFF1E1;--ink:#4A3428;--soft:#8A776B;--accent:#BC5A19;--line:#EBDDD0}
@media(prefers-color-scheme:dark){:root{--bg:#1C1714;--bg-end:#231C18;--ink:#F5EEE9;--soft:#B9AAA0;--accent:#F2A066;--line:#3A302A}}
*{box-sizing:border-box}
html{min-height:100%;background:linear-gradient(var(--bg),var(--bg-end)) fixed var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;padding:48px 16px;text-align:center}
a{color:inherit;text-decoration:none;border-radius:12px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
.app{display:grid;justify-items:center;gap:4px;padding:8px}
.app img{width:128px;height:128px;border-radius:29px;margin-bottom:14px;box-shadow:0 12px 32px rgba(188,90,25,.18),0 2px 6px rgba(74,52,40,.08);transition:transform .2s ease}
.app:hover img{transform:translateY(-2px)}
.name{font-size:26px;font-weight:650;letter-spacing:-.02em}
.sub{font-size:15px;color:var(--soft)}
.app:hover .name{color:var(--accent)}
.academic{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border:1px solid var(--line);border-radius:999px;font-size:15px;color:var(--soft)}
.academic:hover{color:var(--accent);border-color:currentColor}
@media(min-width:640px){.app img{width:152px;height:152px;border-radius:34px}.name{font-size:28px}}
@media(prefers-reduced-motion:reduce){.app img{transition:none}}
</style>
</head>
<body>
<main>
<a class="app" href="calmera/">
<img src="calmera/images/app-icon.png" width="128" height="128" alt="">
<span class="name">Calmera</span>
<span class="sub">Meal journal for iPhone</span>
</a>
<a class="academic" href="https://yufeng-wu.github.io/">Academic website<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11l6-6M6 5h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
</main>
</body>
</html>
